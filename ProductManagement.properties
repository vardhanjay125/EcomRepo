server.port=9001

spring.datasource.username=root
spring.datasource.password=Vardhan@44
spring.datasource.url=jdbc:mysql://localhost:3306/practice3
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.instance_id:${spring.application.name}:${spring.application.instance_id:${random.value}}
eureka.instance.ip-address=127.0.0.1
eureka.instance.hostname=localhost
eureka.instance.prefer-ip-address=false

management.endpoints.web.exposure.include=*

resilience4j.circuitbreaker.instances.productCB.register-health-indicator=true
resilience4j.circuitbreaker.instances.productCB.sliding-window-size=5
resilience4j.circuitbreaker.instances.productCB.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.productCB.wait-duration-in-open-state=10
resilience4j.circuitbreaker.instances.productCB.automatic-transition-from-open-to-half-open-enabled=true
resilience4j.circuitbreaker.instances.productCB.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.productCB.max-wait-duration-in-half-open-state=60
resilience4j.circuitbreaker.instances.productCB.minimum-number-of-calls=3